<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard · Countellect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:opsz,wght@8..144,300;400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="geonerds.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
  /* same dark-mode choice as the game; runs before anything is drawn so the page never flashes light first */
  (function () {
    var b = document.body;
    b.classList.add("no-transition");
    try {
      var saved = localStorage.getItem("darkMode");
      var dark = saved !== null ? JSON.parse(saved) : true;
      if (dark) b.classList.add("dark-mode");
    } catch (e) {}
    window.addEventListener("load", function () {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { b.classList.remove("no-transition"); });
      });
    });
  })();
</script>
<div class="app-container wide-settings profile-page">
  <div class="lb-wrap">
    <div class="profile-topbar">
      <a class="profile-link" href="index.html">← Back to game</a>
<div class="profile-actions"><a class="profile-link" href="profile.html?points=1">How points work</a><a class="profile-link" href="profile.html">My profile</a></div>
    </div>

    <h2>Leaderboard</h2>
    <div class="lb-tabs"><span class="lb-tab on">Points</span><a class="lb-tab" href="state-runs.html">Fastest runs</a></div>
    <p id="lb-note" class="info-intro"></p>

    <div class="lb-search">
      <input type="search" id="lb-search" placeholder="Search players" maxlength="20" autocomplete="off" autocapitalize="off" aria-label="Search players">
    </div>

    <table class="lb-table" id="lb-table">
      <thead><tr><th>#</th><th>Player</th><th>Points</th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="lb-msg" class="info-intro"></p>
    <div id="lb-online-count" class="lb-online-count" role="status" aria-live="polite">
      <span class="online-dot" aria-hidden="true"></span><span>Connecting…</span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="online-presence.js"></script>
<script src="leaderboard.js"></script>
</body>
</html>
