<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How points work · Countellect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:opsz,wght@8..144,300;400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="geonerds.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="points">
<script>
  /* same dark-mode choice as the game; runs before anything is drawn so the page never flashes light first */
  (function () {
    var b = document.body;
    b.classList.add("no-transition");
    try {
      var saved = localStorage.getItem("darkMode");
      var dark = saved !== null ? JSON.parse(saved) : true;
      if (dark) b.classList.add("dark-mode");
    } catch (e) {}
    window.addEventListener("load", function () {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { b.classList.remove("no-transition"); });
      });
    });
  })();
</script>
<div class="app-container wide-settings profile-page">
  <div class="sub-wrap wide">
    <div class="profile-topbar">
      <a class="profile-link" id="back-link" href="profile.html">← My profile</a>
      <div class="profile-actions"><a class="profile-link" href="leaderboard.html">Leaderboard</a></div>
    </div>
    <p id="p-msg" class="info-intro"></p>
    <div id="p-view"><p class="info-intro">Loading…</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="achievements.js"></script>
<script src="badge-art.js"></script>
<script src="profile.js"></script>
</body>
</html>
